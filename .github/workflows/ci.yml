name: SparkLM Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests (pytest + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: learnlm_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: yourpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-ml.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-ml.txt

    - name: Lint with flake8 (syntax errors and undefined names)
      run: |
        pip install flake8
        flake8 backend/LearnLM --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check syntax via compileall
      run: |
        python -m compileall -q backend/LearnLM

    # The frontend's language registry is generated from
    # common/languages.py. Drift means the picker and the backend disagree,
    # which is user-visible: a language offered in the UI but rejected on
    # submit. Fails the build rather than waiting for someone to notice.
    - name: Language registry is in sync
      working-directory: backend/LearnLM
      env:
        POSTGRES_HOST: 127.0.0.1
        SECRET_KEY: ci-only-secret-key
      run: |
        python manage.py export_languages --check

    - name: Run test suite
      working-directory: backend/LearnLM
      env:
        POSTGRES_HOST: 127.0.0.1
        SECRET_KEY: ci-only-secret-key
      run: |
        python -m pytest groups common -q

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    # Separate job, not a step in backend-tests: a vulnerability advisory is
    # not a test failure, and folding it in would make an unrelated CVE look
    # like broken code. It also runs in parallel rather than adding to the
    # critical path.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: pip install pip-audit

    # Audits the pinned requirement file directly rather than an installed
    # environment, so the result describes what production will actually
    # deploy.
    #
    # Its first run found 43 advisories across five packages. Django,
    # daphne and pillow were patch-level fixes on the same minor line and
    # were taken immediately (M4 Phase A). The two below need a real
    # upgrade with its own verification, so they are deferred EXPLICITLY —
    # each with an ID, a reason and an expiry — rather than by dropping
    # --strict, which would silence every future finding too.
    #
    #   PYSEC-2026-2192  langchain 1.2.17 -> 1.3.9
    #       Minor-version bump. langchain 1.x moved the text splitters into
    #       a separate package and this repo already pins
    #       langchain-text-splitters separately; the upgrade needs the RAG
    #       chunking path re-verified, which is Phase C work.
    #       EXPIRES: 2026-10-01
    #
    #   PYSEC-2026-1835  PyPDF2 3.0.1 -> 3.9.0
    #       PyPDF2 is deprecated upstream and requirements.txt already
    #       carries a note to migrate to `pypdf`. Jumping nine minor
    #       versions on a dead package is worse than the migration; do the
    #       migration.
    #       EXPIRES: 2026-10-01
    #
    # At expiry: fix it, or re-justify it in review. Do not silently extend.
    - name: Audit backend dependencies
      run: |
        pip-audit --strict --requirement backend/requirements.txt \
          --ignore-vuln PYSEC-2026-2192 \
          --ignore-vuln PYSEC-2026-1835

  frontend-build:
    name: Frontend Vite Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 24.x, not 20.x. jsdom 30.0.1 declares
    # engines.node = "^22.22.2 || ^24.15.0 || >=26.0.0", so on Node 20 the
    # vitest forks worker failed to start and BOTH test files errored out
    # before running. CI has been red on every push since the frontend
    # tests were added, and the tests it was meant to enforce never
    # executed once. Local dev is 24.15.0 — pinning the same major means
    # green locally and green in CI mean the same thing.
    # (Also clears the runner's Node 20 deprecation warning.)
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: studysphere-ai-11/package-lock.json

    - name: Install dependencies
      working-directory: studysphere-ai-11
      run: npm ci --legacy-peer-deps

    # Runs before the build: a failing unit test should be reported as a
    # failing test, not as a build that happened to come after one.
    # `tsc --noEmit` with the ROOT tsconfig checks nothing: it has
    # "files": [] and only project references, so it silently compiles zero
    # files. It was used as a verification step for two phases and passed
    # over a real defect (an import swallowed by a template literal, leaving
    # an undefined identifier at runtime). The app project is the real one.
    - name: Typecheck (project config, not the empty root one)
      working-directory: studysphere-ai-11
      run: npm run typecheck

    - name: Frontend unit tests (Vitest)
      working-directory: studysphere-ai-11
      run: npm test

    - name: Build frontend
      working-directory: studysphere-ai-11
      run: npm run build

    # The production build guard, exercised for real (M15b). The unit tests
    # cover the predicate; this proves it is actually WIRED INTO the build,
    # which is the part that protects the deployment. A build that succeeds
    # here would mean a production bundle pointing at localhost can ship —
    # deploying green and being completely unreachable, which is invisible to
    # every platform health signal because Vercel still serves HTTP 200.
    - name: Production config guard rejects a localhost API URL
      working-directory: studysphere-ai-11
      env:
        VERCEL_ENV: production
        VITE_API_URL: http://localhost:8000
      run: |
        if npm run build > guard.log 2>&1; then
          echo "::error::The production config guard did NOT reject a localhost VITE_API_URL."
          tail -40 guard.log
          exit 1
        fi
        grep -q "production config" guard.log
        echo "Guard fired as expected:"
        grep "production config" guard.log

  # ── Post-deployment verification ─────────────────────────────────────────
  #
  # Runs only on a push to main — i.e. after the revision that Vercel and
  # Render deploy from. Nothing else watches the JOIN between the two
  # services: Vercel serves the SPA shell with HTTP 200 whatever state the
  # API is in, and Render answers its own health check without any idea
  # whether the frontend can reach it. SparkLM was reported "not opening"
  # while both platforms reported healthy.
  #
  # Non-blocking (`continue-on-error`) on purpose: the API sleeps on Render's
  # free plan, so a cold start or a platform blip must not paint a green
  # commit red. It surfaces the state; it does not gate the merge.
  deployment-smoke:
    name: Deployment Smoke (production URLs)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Standard library only — no pip install, nothing to break.
    - name: Smoke test the deployed frontend and backend
      run: python scripts/deployment_smoke.py
