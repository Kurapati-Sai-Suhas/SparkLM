# Free-tier warm-keeper: Render idles the web service after ~15 min and Neon
# suspends its compute after ~5 min. The first visitor afterwards pays the
# full wake-up, which reads as "the site is broken".
#
# MEASURED 2026-07-29 — the original version of this file did not work, and
# could not report that it did not work:
#
#   * Its comment claimed "GitHub cron granularity is 5 minutes with jitter".
#     That premise is false on the free tier. Actual observed gaps between
#     runs of THIS workflow (GitHub API, run_started_at deltas):
#       213.0  93.2  61.4  71.6  84.2  83.7  98.3  98.2 130.9  95.3
#       119.4 154.6 168.5 192.7  80.7  63.2  62.2  60.0  54.2   (minutes)
#     mean 104.5 · min 54.2 · max 213.0 — EVERY gap exceeds Render's ~15 min
#     idle timeout, so the service spun down between essentially every pair
#     of pings. Warm duty cycle was ~15/104.5 ≈ 14%.
#
#   * A controlled experiment (21 min of zero traffic, no deploy in the
#     window) measured the resulting cold start at 92.9 s TTFB, versus 0.71 s
#     warm. A registration against a cold instance timed out at 90 s and
#     never persisted the row.
#
#   * The old script exited 0 on the FIRST 200 it saw. Because a cold start
#     still eventually returns 200, all 194 historical runs reported success
#     while never preventing a spin-down. A keepalive that cannot fail is not
#     a keepalive — it is a green checkmark.
#
# The ping logic lives in scripts/keepalive.sh so it can be tested; a review
# found the inline version had no behavioural coverage at all. See
# backend/LearnLM/common/test_keepalive_contract.py.
#
# This remains a MITIGATION. The real fix is an external uptime monitor
# honouring a true 5-minute cadence (docs/DEPLOYMENT.md, "Keeping the free
# tier warm"). Once that monitor is live, set LOOP_SECONDS to 0 below: this
# workflow drops to a single ping and stops occupying a runner for 45 minutes
# to do a job something else is already doing.
name: Keep production warm

on:
  schedule:
    # Retained deliberately. GitHub throttles this heavily (see above), so it
    # is a best-effort trigger, NOT a 5-minute guarantee. The in-run loop is
    # what actually provides coverage.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two warm-keepers at once; a firing that lands while one is
# already looping is queued rather than duplicated.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Budget check (the earlier 50 min loop / 55 min timeout could be killed
    # mid-run and reported as a false failure):
    #   last ping may start at  LOOP_SECONDS - 1        = 2699 s
    # + worst-case probe        3x120 s + 2x20 s        =  400 s
    # = worst-case job                                  = 3099 s = 51.7 min
    # which leaves ~3 min of headroom under this timeout.
    timeout-minutes: 55
    env:
      HEALTH_URL: https://sparklm-api.onrender.com/healthz
      # 45 min. Set to 0 once an external uptime monitor is configured.
      LOOP_SECONDS: "2700"
      INTERVAL_SECONDS: "300"
      # Warm healthz measures 0.70-1.46 s; a cold start measured 92.9 s.
      # 10 s sits far above warm noise and far below a cold start, so it
      # detects real regressions without flapping on transient blips.
      WARM_THRESHOLD_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Keep API warm and report cold starts
        run: bash scripts/keepalive.sh
