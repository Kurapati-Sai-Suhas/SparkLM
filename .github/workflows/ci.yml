name: SparkLM Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests (pytest + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: learnlm_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: yourpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-ml.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-ml.txt

    - name: Lint with flake8 (syntax errors and undefined names)
      run: |
        pip install flake8
        flake8 backend/LearnLM --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check syntax via compileall
      run: |
        python -m compileall -q backend/LearnLM

    - name: Run test suite
      working-directory: backend/LearnLM
      env:
        POSTGRES_HOST: 127.0.0.1
        SECRET_KEY: ci-only-secret-key
      run: |
        python -m pytest groups common -q

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    # Separate job, not a step in backend-tests: a vulnerability advisory is
    # not a test failure, and folding it in would make an unrelated CVE look
    # like broken code. It also runs in parallel rather than adding to the
    # critical path.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: pip install pip-audit

    # Audits the pinned requirement file directly rather than an installed
    # environment, so the result describes what production will actually
    # deploy.
    #
    # Its first run found 43 advisories across five packages. Django,
    # daphne and pillow were patch-level fixes on the same minor line and
    # were taken immediately (M4 Phase A). The two below need a real
    # upgrade with its own verification, so they are deferred EXPLICITLY —
    # each with an ID, a reason and an expiry — rather than by dropping
    # --strict, which would silence every future finding too.
    #
    #   PYSEC-2026-2192  langchain 1.2.17 -> 1.3.9
    #       Minor-version bump. langchain 1.x moved the text splitters into
    #       a separate package and this repo already pins
    #       langchain-text-splitters separately; the upgrade needs the RAG
    #       chunking path re-verified, which is Phase C work.
    #       EXPIRES: 2026-10-01
    #
    #   PYSEC-2026-1835  PyPDF2 3.0.1 -> 3.9.0
    #       PyPDF2 is deprecated upstream and requirements.txt already
    #       carries a note to migrate to `pypdf`. Jumping nine minor
    #       versions on a dead package is worse than the migration; do the
    #       migration.
    #       EXPIRES: 2026-10-01
    #
    # At expiry: fix it, or re-justify it in review. Do not silently extend.
    - name: Audit backend dependencies
      run: |
        pip-audit --strict --requirement backend/requirements.txt \
          --ignore-vuln PYSEC-2026-2192 \
          --ignore-vuln PYSEC-2026-1835

  frontend-build:
    name: Frontend Vite Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: studysphere-ai-11/package-lock.json

    - name: Install dependencies
      working-directory: studysphere-ai-11
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: studysphere-ai-11
      run: npm run build
