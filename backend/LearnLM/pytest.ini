[pytest]
DJANGO_SETTINGS_MODULE = LearnLM.settings
python_files = tests.py test_*.py *_tests.py
# -p sparklm_test_isolation MUST come first: it redirects POSTGRES_* to a
# local database before pytest-django configures Django. Without it, a
# .env carrying production credentials makes pytest create its test
# database on PRODUCTION. See sparklm_test_isolation.py.
addopts = -p sparklm_test_isolation --reuse-db
