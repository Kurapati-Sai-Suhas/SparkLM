name: SparkLM Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Pytest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Lint with flake8 (Optional but recommended)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/LearnLM --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Check syntax via compileall
      run: |
        python -m compileall backend/LearnLM

  frontend-build:
    name: Frontend Vite Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: studysphere-ai-11/package-lock.json
        
    - name: Install dependencies
      working-directory: studysphere-ai-11
      run: npm ci --legacy-peer-deps
      
    - name: Build frontend
      working-directory: studysphere-ai-11
      run: npm run build
